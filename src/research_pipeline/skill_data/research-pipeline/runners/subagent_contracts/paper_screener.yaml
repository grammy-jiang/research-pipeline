# paper_screener subagent contract
# Task: paper-screener (paper_screener)
# Executor kind: llm_worker

role: paper_screener
task_id: paper-screener

description: |
  Screen the search candidates returned by the search stage.
  Score each candidate for topical relevance, methodology quality,
  and recency. Produce a shortlist of papers to download and analyze.

inputs:
  - path: "{run_dir}/screen/cheap_scores.jsonl"
    description: "BM25 scored candidates from the screen stage (primary input for LLM re-ranking)"
  - path: "{run_dir}/search/candidates.jsonl"
    description: "Raw search candidates (fallback if cheap_scores.jsonl is not present)"

outputs:
  - path: "{run_dir}/screen/shortlist.json"
    description: "JSON array of RelevanceDecision records; preserve paper/cheap and populate llm rationale/evidence"
    schema: "../../schemas/shortlist.schema.json"

allowed_tools:
  - tool_screen_candidates
  - tool_evaluate_quality
  - tool_enrich
  - tool_compute_semantic_scores
  # Read-only file tools
  - view
  - grep
  - glob

forbidden_actions:
  - Do NOT edit or delete any input files
  - Do NOT call tool_download_pdfs or any download/conversion tools
  - Do NOT write to paths outside the run workspace
  - Do NOT make network calls except through the allowed MCP tools

screening_criteria:
  relevance:
    description: "Does the paper directly address the research topic?"
    weight: 0.5
    threshold: 0.6
  methodology:
    description: "Does the paper describe a replicable method or empirical study?"
    weight: 0.25
    threshold: 0.4
  recency:
    description: "Is the paper from the last 5 years (or foundational)?"
    weight: 0.25
    threshold: 0.0

evidence_requirements:
  - Every accepted paper must have a non-empty abstract
  - Every accepted paper must have a relevance score comment
  - Rejection reasons must be explicit (irrelevant / out_of_scope / low_quality / duplicate)

completion_criteria:
  - "{run_dir}/screen/shortlist.json exists"
  - "Shortlist is nonempty; explain limited coverage instead of inventing papers"
  - "Accepted papers have llm.llm_score >= 0.6 and nonempty llm.rationale/evidence_quotes"
  - "All rejected papers have rejection_reason"

validation_gate:
  command: "uv run research-pipeline verify --run-id {run_id} --stage screen"
  must_pass: true

self_reporting_forbidden: true
status_update: |
  After completing screening:
  1. Verify shortlist.json exists at {run_dir}/screen/shortlist.json and has at least one supported entry
  2. Do NOT mark the task accepted yourself
  3. Return success and the shortlist path; the parent submits --complete-task paper-screener --result-file RESULT.json

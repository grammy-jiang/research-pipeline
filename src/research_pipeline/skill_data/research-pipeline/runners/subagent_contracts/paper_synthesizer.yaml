# Cross-paper synthesis contract: the JSON is the renderer's actual input.
role: paper_synthesizer
task_id: paper-synthesizer
description: |
  Synthesize the analyzed papers into the CrossPaperSynthesisRecord schema.
  Preserve disagreements, evidence limitations, and gaps relevant to the user's
  research questions. Distinguish source findings from system inference.
inputs:
  - path: "{run_dir}/analysis/*.analysis.json"
  - path: "{run_dir}/screen/shortlist.json"
  - path: "{run_dir}/search/source_coverage.json"
  - path: "{skill_dir}/schemas/synthesis_report.schema.json"
outputs:
  - path: "{run_dir}/analysis/synthesis.json"
    schema: "../../schemas/synthesis_report.schema.json"
allowed_tools: [view, grep, glob]
forbidden_actions:
  - Do not fabricate evidence, citations, retrieval coverage, or user requirements.
  - Do not edit the per-paper analyses or publish the final report.
required_content:
  - corpus with paper_id, title, and available bibliographic metadata
  - methodology including actual source and date coverage and acquisition failures
  - taxonomy, recurring_patterns, and evidence_strength_map with supporting_papers
  - contradiction_map preserving unresolved disagreements and their sources
  - operational_implications, design_implications, and reusable_mechanism_inventory
  - unresolved_questions with ACADEMIC or ENGINEERING labels and targeted next steps
  - traceability_appendix connecting claims to paper IDs and source locations
evidence_requirements:
  - Every finding must cite supporting_papers present in corpus and the shortlist.
  - Mark uncertain interpretations; retrieval failures are coverage limitations.
  - Use empty arrays for absent categories and explain material coverage limits.
completion_criteria:
  - synthesis.json validates against the declared schema.
  - The report task renders this exact JSON into report/draft.md for review.
self_reporting_forbidden: true
status_update: |
  Return a result JSON with success=true and the output path.
  The parent submits --complete-task paper-synthesizer --result-file RESULT.json.
  Only the runner accepts the task. Do not edit workflow_state.json directly.
